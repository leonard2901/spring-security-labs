logging:
  level:
    de.trion.trainingapp: info
    org.springframework.security: debug

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

spring:
  data:
    web:
      pageable:
        default-page-size: 4
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ''
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/dev-migration

server:
  ssl:
    enabled: true
    client-auth: want # Client-Zertifikat ist optional
    certificate: classpath:fullchain.pem
    certificate-private-key: classpath:privkey.pem
    trust-store: classpath:truststore.p12
    trust-store-password: secret

---
spring:
  config:
    activate:
      on-profile: flyway
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: false
  sql:
    init:
      schema-locations: classpath:org/springframework/security/core/userdetails/jdbc/users.ddl


---
spring:
  config:
    activate:
      on-profile: mariadb

  datasource:
    url: jdbc:mariadb://localhost/app
    username: app
    password: app

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ''

  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/dev-migration
